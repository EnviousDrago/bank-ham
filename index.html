<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Ham</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
      radial-gradient(circle at top left, #3b1d1d, transparent 35%),
      radial-gradient(circle at bottom right, #1f3b35, transparent 35%),
      #0f0f0f;
    background-size: 45px 45px, 45px 45px, 100% 100%, 100% 100%, 100% 100%;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    cursor: none;
    overflow: hidden;
  }

  body.event-active {
    background:
      linear-gradient(rgba(255, 220, 80, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 220, 80, 0.08) 1px, transparent 1px),
      radial-gradient(circle at center, #5b4200, transparent 40%),
      #0f0f0f;
    background-size: 45px 45px, 45px 45px, 100% 100%, 100% 100%;
  }

  h1 {
    margin: 0;
    padding: 28px;
    font-size: 4.5rem;
    color: #ffdf5d;
    text-shadow: 0 0 10px #ff3b3b, 0 0 25px #ff9900;
  }

  .game-area {
    height: calc(100vh - 120px);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #target {
    width: 360px;
    max-width: 70vw;
    border-radius: 14px;
    display: block;
    box-shadow: 0 0 30px rgba(255, 223, 93, 0.25);
  }

  body.event-active #target {
    box-shadow: 0 0 35px #ffdf5d, 0 0 90px rgba(255, 223, 93, 0.45);
  }

  #target.bonk {
    animation: bonk 0.16s ease;
  }

  @keyframes bonk {
    0% { transform: scale(1) rotate(0deg); }
    40% { transform: scale(0.93) rotate(-3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .scoreboard,
  .selector {
    position: fixed;
    width: 260px;
    padding: 20px;
    border: 3px solid #ffdf5d;
    background: rgba(0, 0, 0, 0.72);
    border-radius: 14px;
    box-shadow: 0 0 35px rgba(255, 223, 93, 0.28);
    z-index: 50;
  }

  .scoreboard {
    right: 25px;
    top: 88px;
  }

  .selector {
    left: 25px;
    top: 120px;
  }

  .score-label,
  .cps-label,
  .level-label,
  .selector-title,
  .combo-label,
  .hp-label,
  .stone-label {
    font-size: 1.2rem;
    color: #ffdf5d;
  }

  #score {
    font-size: 3.5rem;
    font-weight: bold;
    line-height: 1;
    margin-bottom: 12px;
  }

  #cps,
  #level,
  #combo,
  #stones {
    font-size: 2.15rem;
    font-weight: bold;
  }

  .panel-section {
    border-top: 2px solid rgba(255, 223, 93, 0.45);
    padding-top: 11px;
    margin-top: 11px;
  }

  #nextUnlock,
  #saveText,
  #passiveText,
  #attackText {
    margin-top: 8px;
    font-size: 0.92rem;
    opacity: 0.85;
  }

  .bar {
    width: 100%;
    height: 13px;
    background: #222;
    border: 1px solid rgba(255, 223, 93, 0.7);
    border-radius: 99px;
    overflow: hidden;
    margin-top: 8px;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    background: #ffdf5d;
  }

  #hpFill {
    background: #ff4545;
  }

  .person-button {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 2px solid #ffdf5d;
    background: #151515;
    color: white;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 10px;
    cursor: none;
  }

  .person-button.active {
    background: #ffdf5d;
    color: #111;
  }

  .person-button.locked {
    opacity: 0.45;
    border-color: #777;
  }

  .shop-toggle {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 130;
    padding: 14px 22px;
    border: 3px solid #ffdf5d;
    background: #151515;
    color: #ffdf5d;
    border-radius: 14px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: none;
    box-shadow: 0 0 28px rgba(255, 223, 93, 0.28);
  }

  .shop-toggle.open {
    background: #ffdf5d;
    color: #111;
  }

  .shop-panel {
    position: fixed;
    right: 0;
    top: 0;
    height: 100vh;
    width: 340px;
    padding: 22px;
    background: rgba(8, 8, 8, 0.96);
    border-left: 4px solid #ffdf5d;
    box-shadow: -18px 0 50px rgba(0, 0, 0, 0.55);
    z-index: 120;
    transform: translateX(110%);
    transition: transform 0.22s ease;
    text-align: left;
  }

  .shop-panel.open {
    transform: translateX(0);
  }

  .shop-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }

  .shop-title {
    color: #ffdf5d;
    font-size: 2rem;
    font-weight: bold;
  }

  .shop-subtitle {
    margin-top: 4px;
    color: rgba(255, 255, 255, 0.72);
    font-size: 0.92rem;
  }

  .shop-close {
    width: 42px;
    height: 42px;
    border: 2px solid #ffdf5d;
    background: #151515;
    color: #ffdf5d;
    border-radius: 10px;
    font-size: 1.7rem;
    line-height: 1;
    font-weight: bold;
    cursor: none;
  }

  .shop-stones {
    margin: 20px 0 14px;
    padding: 14px;
    border: 2px solid rgba(255, 223, 93, 0.75);
    border-radius: 12px;
    color: #ffdf5d;
    font-size: 1.25rem;
    font-weight: bold;
    text-align: center;
  }

  .shop-item {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 12px;
    padding: 14px;
    margin-top: 14px;
    border: 2px solid rgba(255, 223, 93, 0.55);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.045);
  }

  .shop-item.owned {
    border-color: #75ff9b;
  }

  .shop-item img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid rgba(255, 223, 93, 0.65);
    background: #222;
  }

  .shop-item-title {
    color: white;
    font-size: 1.15rem;
    font-weight: bold;
  }

  .shop-item-desc {
    margin-top: 4px;
    color: rgba(255, 255, 255, 0.75);
    font-size: 0.9rem;
    line-height: 1.3;
  }

  .buy-button {
    grid-column: 1 / -1;
    padding: 10px;
    border: 2px solid #ffdf5d;
    background: #ffdf5d;
    color: #111;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: bold;
    cursor: none;
  }

  .buy-button:disabled {
    opacity: 0.55;
    background: #333;
    color: white;
    border-color: #777;
  }

  .helper-rack {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 65;
    pointer-events: none;
  }

  .helper-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border: 2px solid #75ff9b;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.74);
    box-shadow: 0 0 20px rgba(117, 255, 155, 0.22);
  }

  .helper-chip img {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 10px;
  }

  .helper-chip-text {
    text-align: left;
    font-size: 0.88rem;
    line-height: 1.2;
  }

  .helper-chip-name {
    color: #75ff9b;
    font-weight: bold;
  }

  .event-panel {
    position: fixed;
    left: 50%;
    top: 105px;
    transform: translateX(-50%);
    width: 330px;
    padding: 16px;
    border: 3px solid white;
    background: rgba(255, 204, 0, 0.92);
    color: #111;
    border-radius: 14px;
    font-weight: bold;
    z-index: 80;
    box-shadow: 0 0 35px rgba(255, 223, 93, 0.7);
  }

  .hidden {
    display: none;
  }

  .event-title {
    font-size: 1.5rem;
  }

  #jesperTimer {
    font-size: 2.4rem;
  }

  .jesper-helper {
    position: fixed;
    left: 28px;
    bottom: 25px;
    z-index: 70;
    width: 135px;
    text-align: center;
    pointer-events: none;
  }

  .jesper-helper img {
    width: 110px;
    border-radius: 12px;
    border: 3px solid #ffdf5d;
    background: rgba(0, 0, 0, 0.55);
    box-shadow: 0 0 24px rgba(255, 223, 93, 0.45);
  }

  .jesper-helper.throwing img {
    animation: helperThrow 0.35s ease;
  }

  @keyframes helperThrow {
    0% { transform: rotate(0deg) scale(1); }
    45% { transform: rotate(-10deg) scale(1.08); }
    100% { transform: rotate(0deg) scale(1); }
  }

  .helper-bubble {
    position: absolute;
    left: 95px;
    bottom: 105px;
    width: 175px;
    padding: 10px 12px;
    background: white;
    color: #111;
    border: 3px solid #ffdf5d;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: bold;
    animation: helperBubble 1.6s ease-out forwards;
  }

  @keyframes helperBubble {
    0% { transform: scale(0.5); opacity: 0; }
    15% { transform: scale(1); opacity: 1; }
    80% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.85) translateY(-10px); opacity: 0; }
  }

  .trimmer-projectile {
    position: fixed;
    left: 0;
    top: 0;
    width: 58px;
    z-index: 9996;
    pointer-events: none;
    transition: transform 0.48s linear, opacity 0.48s linear;
  }

  .golden-ring {
    position: fixed;
    left: 0;
    top: 0;
    width: 170px;
    height: 170px;
    border: 7px solid #ffdf5d;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9995;
    box-shadow: 0 0 20px #ffdf5d, 0 0 55px rgba(255, 223, 93, 0.8);
    animation: goldenRing 0.9s ease-out forwards;
  }

  @keyframes goldenRing {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
  }

  .speech-bubble {
    position: fixed;
    max-width: 330px;
    padding: 15px 19px;
    background: white;
    color: #111;
    border: 3px solid #ffdf5d;
    border-radius: 16px;
    font-size: 1.35rem;
    font-weight: bold;
    z-index: 9997;
    pointer-events: none;
    animation: bubblePop 1.8s ease-out forwards;
    box-shadow: 0 0 22px rgba(255, 223, 93, 0.4);
  }

  .speech-bubble.rare {
    background: #ff3b3b;
    color: white;
    border-color: white;
  }

  .speech-bubble::after {
    content: "";
    position: absolute;
    left: 35px;
    bottom: -15px;
    border-width: 15px 12px 0 12px;
    border-style: solid;
    border-color: white transparent transparent transparent;
  }

  .speech-bubble.rare::after {
    border-color: #ff3b3b transparent transparent transparent;
  }

  .speech-bubble.tail-right::after {
    left: auto;
    right: 35px;
  }

  .speech-bubble.tail-center::after {
    left: 50%;
    transform: translateX(-50%);
  }

  @keyframes bubblePop {
    0% { transform: scale(0.5) translateY(10px); opacity: 0; }
    15% { transform: scale(1) translateY(0); opacity: 1; }
    75% { transform: scale(1) translateY(0); opacity: 1; }
    100% { transform: scale(0.9) translateY(-18px); opacity: 0; }
  }

  .hammer-cursor {
    position: fixed;
    left: 0;
    top: 0;
    width: 64px;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-22px, -20px);
    transform-origin: 70% 70%;
  }

  .hammer-cursor.swing {
    animation: hammerSwing 0.18s ease;
  }

  @keyframes hammerSwing {
    0% { transform: translate(-22px, -20px) rotate(0deg); }
    50% { transform: translate(-22px, -20px) rotate(-40deg); }
    100% { transform: translate(-22px, -20px) rotate(0deg); }
  }

  .hit-effect,
  .critical-effect {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 9999;
  }

  .hit-effect {
    font-size: 75px;
    animation: hit 0.5s ease-out forwards;
  }

  .critical-effect {
    color: #ffdf5d;
    font-size: 2rem;
    font-weight: bold;
    text-shadow: 0 0 10px #ff3b3b;
    animation: crit 0.7s ease-out forwards;
  }

  @keyframes hit {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
  }

  @keyframes crit {
    0% { transform: translate(-50%, -50%) scale(0.7); opacity: 1; }
    100% { transform: translate(-50%, -130%) scale(1.4); opacity: 0; }
  }
</style>
</head>

<body>

<h1>Bank Ham</h1>

<button id="shopToggle" class="shop-toggle">Shop</button>

<div id="shopPanel" class="shop-panel">
  <div class="shop-header">
    <div>
      <div class="shop-title">Helper Shop</div>
      <div class="shop-subtitle">Buy students with stones. Buffs only work against their teacher.</div>
    </div>
    <button id="shopClose" class="shop-close">×</button>
  </div>

  <div class="shop-stones">Stones: <span id="shopStones">0</span></div>
  <div id="shopItems"></div>
</div>

<div id="helperRack" class="helper-rack hidden"></div>

<div id="jesperPanel" class="event-panel hidden">
  <div class="event-title">JESPER EVENT</div>
  <div id="jesperTimer">10.0s</div>
  <div id="jesperClicks">0 / 100 clicks</div>
  <div class="bar"><div id="jesperFill" class="bar-fill"></div></div>
</div>

<div id="jesperHelper" class="jesper-helper hidden">
  <img src="jesper.jpg" alt="Jesper helper">
</div>

<div class="selector">
  <div class="selector-title">Choose Person</div>
  <div id="personButtons"></div>
</div>

<div class="scoreboard">
  <div class="score-label">Hits</div>
  <div id="score">0</div>

  <div class="panel-section">
    <div class="stone-label">Stones</div>
    <div id="stones">0</div>
  </div>

  <div class="panel-section">
    <div class="cps-label">CPS</div>
    <div id="cps">0.0</div>
  </div>

  <div class="panel-section">
    <div class="combo-label">Combo</div>
    <div id="combo">0x</div>
    <div class="bar"><div id="comboFill" class="bar-fill"></div></div>
  </div>

  <div class="panel-section">
    <div class="hp-label" id="hpLabel">HP</div>
    <div id="hpText">100 / 100</div>
    <div class="bar"><div id="hpFill" class="bar-fill"></div></div>
    <div id="attackText">Attack: 1 damage</div>
  </div>

  <div class="panel-section">
    <div class="level-label">Level</div>
    <div id="level">1</div>
    <div id="nextUnlock">Next: Britta at 750 hits</div>
    <div id="passiveText">Jesper passive: locked</div>
    <div id="saveText">Progress saved</div>
  </div>
</div>

<div class="game-area">
  <img id="target" src="steen.png" alt="Steen">
</div>

<img class="hammer-cursor" src="hammer.png" alt="">

<script>
const SAVE_KEY = "bankHamSaveV5";

const target = document.getElementById("target");
const hammer = document.querySelector(".hammer-cursor");
const score = document.getElementById("score");
const stonesText = document.getElementById("stones");
const shopStones = document.getElementById("shopStones");
const cps = document.getElementById("cps");
const level = document.getElementById("level");
const nextUnlock = document.getElementById("nextUnlock");
const passiveText = document.getElementById("passiveText");
const personButtons = document.getElementById("personButtons");
const combo = document.getElementById("combo");
const comboFill = document.getElementById("comboFill");
const hpLabel = document.getElementById("hpLabel");
const hpText = document.getElementById("hpText");
const hpFill = document.getElementById("hpFill");
const attackText = document.getElementById("attackText");
const jesperPanel = document.getElementById("jesperPanel");
const jesperTimer = document.getElementById("jesperTimer");
const jesperClicksText = document.getElementById("jesperClicks");
const jesperFill = document.getElementById("jesperFill");
const jesperHelper = document.getElementById("jesperHelper");
const shopToggle = document.getElementById("shopToggle");
const shopClose = document.getElementById("shopClose");
const shopPanel = document.getElementById("shopPanel");
const shopItems = document.getElementById("shopItems");
const helperRack = document.getElementById("helperRack");

const people = [
  {
    name: "Steen",
    file: "steen.png",
    unlockAt: 0,
    maxHp: 100,
    jesperChance: 0.004,
    jesperPityLimit: 260,
    bubbles: [
      "hvad fanden var det!!!!",
      "jeg fik den LIGE på hovedt!!!!"
    ],
    rareBubbles: [
      "walla jeg rammer tilbage din lille taber!!!!",
      "fedt evan, fedt du har kage med"
    ]
  },
  {
    name: "Britta",
    file: "britta500.jpg",
    unlockAt: 750,
    maxHp: 160,
    jesperChance: 0.005,
    jesperPityLimit: 230,
    bubbles: [
      "jeg skriver hjem!!!!!!",
      "ud fra klassen nu.",
      "drenge.",
      "det her et stille rum",
      "ned i teskten op i karakter",
      "alle sammen skal have mullighed at lære"
    ],
    rareBubbles: [
      "jeg chopper dig ned walla"
    ]
  },
  {
    name: "Mette",
    file: "mette1000.jpg",
    unlockAt: 1750,
    maxHp: 240,
    jesperChance: 0.006,
    jesperPityLimit: 200,
    bubbles: [
      "jeg gider ikk at diskuter",
      "BOWLLINGGGGGGG"
    ],
    rareBubbles: []
  }
];

const helpers = [
  {
    id: "mussen",
    name: "Mussen",
    file: "mussen.png",
    price: 250,
    targetName: "Britta",
    bonus: 10
  },
  {
    id: "gusse",
    name: "Gusse",
    file: "gusse.png",
    price: 700,
    targetName: "Mette",
    bonus: 20
  }
];

let hits = 0;
let stones = 0;
let clickTimes = [];
let selectedPerson = 0;
let hpByPerson = people.map(person => person.maxHp);
let comboCount = 0;
let lastClickTime = 0;
let comboResetTimer = null;
let saveTimer = null;
let shopOpen = false;
let ownedHelpers = {};

let jesperPassiveUnlocked = false;
let jesperEventActive = false;
let jesperEventClicks = 0;
let jesperEventEndTime = 0;
let jesperEventTimer = null;
let jesperMisses = 0;

helpers.forEach(function(helper) {
  ownedHelpers[helper.id] = false;
});

function loadGame() {
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!saved) return;

    hits = saved.hits || 0;
    stones = saved.stones || 0;
    selectedPerson = saved.selectedPerson || 0;
    jesperPassiveUnlocked = saved.jesperPassiveUnlocked || false;
    jesperMisses = saved.jesperMisses || 0;
    shopOpen = saved.shopOpen || false;

    if (saved.ownedHelpers) {
      helpers.forEach(function(helper) {
        ownedHelpers[helper.id] = saved.ownedHelpers[helper.id] || false;
      });
    }

    if (Array.isArray(saved.hpByPerson)) {
      hpByPerson = people.map(function(person, index) {
        return saved.hpByPerson[index] || person.maxHp;
      });
    }

    if (!isUnlocked(selectedPerson)) {
      selectedPerson = 0;
    }
  } catch (error) {
    console.log("Could not load save.");
  }
}

function saveGameNow() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      hits: hits,
      stones: stones,
      selectedPerson: selectedPerson,
      jesperPassiveUnlocked: jesperPassiveUnlocked,
      jesperMisses: jesperMisses,
      hpByPerson: hpByPerson,
      ownedHelpers: ownedHelpers,
      shopOpen: shopOpen
    }));
  } catch (error) {
    console.log("Could not save game.");
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveGameNow, 250);
}

function getLevel() {
  if (hits >= 1750) return 3;
  if (hits >= 750) return 2;
  return 1;
}

function isUnlocked(personIndex) {
  return hits >= people[personIndex].unlockAt;
}

function updateMoneyText() {
  stonesText.textContent = stones;
  shopStones.textContent = stones;
}

function addStones(amount) {
  stones += amount;
  updateMoneyText();
  updateShopButtons();
  scheduleSave();
}

function addHits(amount) {
  hits += amount;
  score.textContent = hits;
  updateLevelText();
  renderPersonButtons();
  scheduleSave();
}

function getHelperBonus() {
  if (jesperEventActive) return 0;

  const selectedName = people[selectedPerson].name;

  return helpers.reduce(function(total, helper) {
    if (ownedHelpers[helper.id] && helper.targetName === selectedName) {
      return total + helper.bonus;
    }

    return total;
  }, 0);
}

function getAttackDamage(baseDamage) {
  return baseDamage + getHelperBonus();
}

function updateAttackText() {
  if (jesperEventActive) {
    attackText.textContent = "Event attack: 1 click";
    return;
  }

  const bonus = getHelperBonus();
  const damage = getAttackDamage(1);

  attackText.textContent = bonus > 0
    ? "Attack: " + damage + " damage (+" + bonus + " helper)"
    : "Attack: " + damage + " damage";
}

function updateCps() {
  const now = Date.now();

  clickTimes = clickTimes.filter(function(time) {
    return now - time < 1000;
  });

  cps.textContent = clickTimes.length.toFixed(1);
}

function updateLevelText() {
  level.textContent = getLevel();

  if (hits < 750) {
    nextUnlock.textContent = "Next: Britta at 750 hits";
  } else if (hits < 1750) {
    nextUnlock.textContent = "Next: Mette at 1750 hits";
  } else {
    nextUnlock.textContent = "All people unlocked";
  }

  passiveText.textContent = jesperPassiveUnlocked
    ? "Jesper passive: trimmer throw +10"
    : "Jesper passive: locked";

  updateJesperHelper();
  updateAttackText();
}

function updateJesperHelper() {
  if (jesperPassiveUnlocked && !jesperEventActive) {
    jesperHelper.classList.remove("hidden");
  } else {
    jesperHelper.classList.add("hidden");
  }
}

function updateHp() {
  if (jesperEventActive) {
    hpLabel.textContent = "Jesper Goal";
    hpText.textContent = jesperEventClicks + " / 100";
    hpFill.style.width = jesperEventClicks + "%";
    updateAttackText();
    return;
  }

  const person = people[selectedPerson];
  const hp = hpByPerson[selectedPerson];

  hpLabel.textContent = person.name + " HP";
  hpText.textContent = hp + " / " + person.maxHp;
  hpFill.style.width = ((hp / person.maxHp) * 100) + "%";
  updateAttackText();
}

function damagePerson(amount) {
  if (jesperEventActive) return;

  const person = people[selectedPerson];

  hpByPerson[selectedPerson] -= amount;

  if (hpByPerson[selectedPerson] <= 0) {
    hpByPerson[selectedPerson] = person.maxHp;
    showBubble(person.name + " got knocked out!", true);
  }

  updateHp();
  scheduleSave();
}

function updateCombo() {
  combo.textContent = comboCount + "x";
  comboFill.style.width = Math.min(100, comboCount * 2) + "%";
}

function registerComboClick() {
  const now = Date.now();

  if (now - lastClickTime < 700) {
    comboCount++;
  } else {
    comboCount = 1;
  }

  lastClickTime = now;
  updateCombo();

  clearTimeout(comboResetTimer);

  comboResetTimer = setTimeout(function() {
    comboCount = 0;
    updateCombo();
  }, 1200);
}

function renderPersonButtons() {
  personButtons.innerHTML = "";

  people.forEach(function(person, index) {
    const button = document.createElement("button");

    button.className = "person-button";
    button.textContent = isUnlocked(index)
      ? person.name
      : person.name + " - locked";

    if (index === selectedPerson) {
      button.classList.add("active");
    }

    if (!isUnlocked(index)) {
      button.classList.add("locked");
    }

    button.addEventListener("click", function() {
      if (jesperEventActive) {
        showBubble("Finish the Jesper event first!", true);
        return;
      }

      if (!isUnlocked(index)) {
        showBubble("Unlock at " + person.unlockAt + " hits!", false);
        return;
      }

      selectedPerson = index;
      target.src = person.file;
      target.alt = person.name;

      renderPersonButtons();
      updateHp();
      renderHelperRack();
      showBubble(person.name + " selected!", false);
      scheduleSave();
    });

    personButtons.appendChild(button);
  });
}

function updateShopVisibility() {
  shopPanel.classList.toggle("open", shopOpen);
  shopToggle.classList.toggle("open", shopOpen);
  shopToggle.textContent = shopOpen ? "Close Shop" : "Shop";
}

function renderShop() {
  shopItems.innerHTML = "";
  updateMoneyText();

  helpers.forEach(function(helper) {
    const owned = ownedHelpers[helper.id];

    const item = document.createElement("div");
    item.className = owned ? "shop-item owned" : "shop-item";
    item.setAttribute("data-helper-item", helper.id);

    const image = document.createElement("img");
    image.src = helper.file;
    image.alt = helper.name;

    image.onerror = function() {
      image.style.display = "none";
    };

    const text = document.createElement("div");

    const title = document.createElement("div");
    title.className = "shop-item-title";
    title.textContent = helper.name;

    const description = document.createElement("div");
    description.className = "shop-item-desc";
    description.textContent = "+" + helper.bonus + " damage against " + helper.targetName + " only.";

    text.appendChild(title);
    text.appendChild(description);

    const button = document.createElement("button");
    button.className = "buy-button";
    button.setAttribute("data-helper-button", helper.id);

    button.addEventListener("click", function() {
      buyHelper(helper.id);
    });

    item.appendChild(image);
    item.appendChild(text);
    item.appendChild(button);
    shopItems.appendChild(item);
  });

  updateShopButtons();
}

function updateShopButtons() {
  updateMoneyText();

  helpers.forEach(function(helper) {
    const item = shopItems.querySelector("[data-helper-item=\"" + helper.id + "\"]");
    const button = shopItems.querySelector("[data-helper-button=\"" + helper.id + "\"]");

    if (!item || !button) return;

    const owned = ownedHelpers[helper.id];

    item.classList.toggle("owned", owned);

    if (owned) {
      button.textContent = "Owned";
      button.disabled = true;
    } else if (stones < helper.price) {
      button.textContent = helper.price + " stones";
      button.disabled = true;
    } else {
      button.textContent = "Buy for " + helper.price + " stones";
      button.disabled = false;
    }
  });
}

function renderHelperRack() {
  helperRack.innerHTML = "";

  const selectedName = people[selectedPerson].name;

  const owned = helpers.filter(function(helper) {
    return ownedHelpers[helper.id] && helper.targetName === selectedName;
  });

  if (owned.length === 0) {
    helperRack.classList.add("hidden");
    return;
  }

  helperRack.classList.remove("hidden");

  owned.forEach(function(helper) {
    const chip = document.createElement("div");
    chip.className = "helper-chip";

    const image = document.createElement("img");
    image.src = helper.file;
    image.alt = helper.name;

    const text = document.createElement("div");
    text.className = "helper-chip-text";

    text.innerHTML =
      "<div class=\"helper-chip-name\">" + helper.name + "</div>" +
      "<div>+" + helper.bonus + " vs " + helper.targetName + "</div>";

    chip.appendChild(image);
    chip.appendChild(text);
    helperRack.appendChild(chip);
  });
}

function buyHelper(helperId) {
  const helper = helpers.find(function(item) {
    return item.id === helperId;
  });

  if (!helper || ownedHelpers[helperId]) return;

  if (stones < helper.price) {
    showBubble("Need " + helper.price + " stones!", false);
    return;
  }

  stones -= helper.price;
  ownedHelpers[helperId] = true;

  updateMoneyText();
  updateAttackText();
  updateShopButtons();
  renderHelperRack();
  scheduleSave();
  showBubble(helper.name + " joined your helpers!", true);
}

function showBubble(text, rare) {
  const rect = target.getBoundingClientRect();
  const bubble = document.createElement("div");
  const positions = ["left", "right", "top"];
  const position = positions[Math.floor(Math.random() * positions.length)];

  bubble.className = rare ? "speech-bubble rare" : "speech-bubble";
  bubble.textContent = text;

  let left;
  let top;

  if (position === "left") {
    left = rect.left - 345;
    top = rect.top + 20;
    bubble.classList.add("tail-right");
  } else if (position === "right") {
    left = rect.right + 20;
    top = rect.top + 20;
  } else {
    left = rect.left + rect.width / 2 - 165;
    top = rect.top - 105;
    bubble.classList.add("tail-center");
  }

  left = Math.max(12, Math.min(window.innerWidth - 350, left));
  top = Math.max(85, Math.min(window.innerHeight - 125, top));

  bubble.style.left = left + "px";
  bubble.style.top = top + "px";

  document.body.appendChild(bubble);

  setTimeout(function() {
    bubble.remove();
  }, 1800);
}

function maybeShowBubble() {
  const person = people[selectedPerson];
  const roll = Math.random();

  if (person.rareBubbles.length > 0 && roll < 0.003) {
    showBubble(person.rareBubbles[Math.floor(Math.random() * person.rareBubbles.length)], true);
  } else if (roll < 0.02) {
    showBubble(person.bubbles[Math.floor(Math.random() * person.bubbles.length)], false);
  }
}

function showJesperHelperBubble() {
  if (Math.random() > 0.03) return;

  const oldBubble = jesperHelper.querySelector(".helper-bubble");

  if (oldBubble) {
    oldBubble.remove();
  }

  const bubble = document.createElement("div");
  bubble.className = "helper-bubble";
  bubble.textContent = "Fri fra skole!";

  jesperHelper.appendChild(bubble);

  setTimeout(function() {
    bubble.remove();
  }, 1600);
}

function throwTrimmerFromJesper() {
  if (!jesperPassiveUnlocked || jesperEventActive) return;

  const helperRect = jesperHelper.getBoundingClientRect();
  const targetRect = target.getBoundingClientRect();

  const startX = helperRect.left + helperRect.width * 0.55;
  const startY = helperRect.top + helperRect.height * 0.35;
  const endX = targetRect.left + targetRect.width * 0.5;
  const endY = targetRect.top + targetRect.height * 0.5;

  const projectile = document.createElement("img");

  projectile.className = "trimmer-projectile";
  projectile.src = "trimmer.png";
  projectile.alt = "";

  projectile.style.left = startX + "px";
  projectile.style.top = startY + "px";
  projectile.style.transform = "translate(-50%, -50%) rotate(0deg)";

  document.body.appendChild(projectile);

  jesperHelper.classList.remove("throwing");
  void jesperHelper.offsetWidth;
  jesperHelper.classList.add("throwing");

  requestAnimationFrame(function() {
    projectile.style.transform =
      "translate(" + (endX - startX - 29) + "px, " + (endY - startY - 29) + "px) rotate(720deg)";
  });

  setTimeout(function() {
    const damage = 10;

    projectile.remove();

    for (let i = 0; i < damage; i++) {
      clickTimes.push(Date.now());
    }

    addHits(damage);
    addStones(1);
    damagePerson(damage);
    createHitEffect(endX, endY, true, damage, "TRIMMER +" + damage);
    animateTarget(false);
    showJesperHelperBubble();
  }, 480);
}

function maybeStartJesperEvent() {
  if (jesperPassiveUnlocked || jesperEventActive || hits < 250) return;

  const person = people[selectedPerson];

  jesperMisses++;

  const gotLucky = Math.random() < person.jesperChance;
  const hitPityLimit = jesperMisses >= person.jesperPityLimit;

  if (!gotLucky && !hitPityLimit) return;

  const testImage = new Image();

  testImage.onload = function() {
    jesperMisses = 0;
    startJesperEvent();
    scheduleSave();
  };

  testImage.onerror = function() {
    showBubble("Upload jesper.jpg first!", true);
  };

  testImage.src = "jesper.jpg?check=" + Date.now();
}

function showGoldenRing() {
  const rect = target.getBoundingClientRect();
  const ring = document.createElement("div");

  ring.className = "golden-ring";
  ring.style.left = (rect.left + rect.width / 2) + "px";
  ring.style.top = (rect.top + rect.height / 2) + "px";

  document.body.appendChild(ring);

  setTimeout(function() {
    ring.remove();
  }, 900);
}

function startJesperEvent() {
  jesperEventActive = true;
  jesperEventClicks = 0;
  jesperEventEndTime = Date.now() + 10000;

  document.body.classList.add("event-active");
  jesperPanel.classList.remove("hidden");

  target.src = "jesper.jpg";
  target.alt = "Jesper";
  hammer.src = "trimmer.png";

  updateJesperHelper();
  setTimeout(showGoldenRing, 80);
  showBubble("JESPER APPEARED! 100 clicks in 10 seconds!", true);
  updateJesperEvent();

  clearInterval(jesperEventTimer);
  jesperEventTimer = setInterval(updateJesperEvent, 100);
}

function updateJesperEvent() {
  if (!jesperEventActive) return;

  const timeLeft = Math.max(0, jesperEventEndTime - Date.now());
  const seconds = (timeLeft / 1000).toFixed(1);

  jesperTimer.textContent = seconds + "s";
  jesperClicksText.textContent = jesperEventClicks + " / 100 clicks";
  jesperFill.style.width = jesperEventClicks + "%";

  updateHp();

  if (timeLeft <= 0 && jesperEventClicks < 100) {
    finishJesperEvent(false);
  }
}

function finishJesperEvent(success) {
  jesperEventActive = false;

  clearInterval(jesperEventTimer);

  document.body.classList.remove("event-active");
  jesperPanel.classList.add("hidden");

  hammer.src = "hammer.png";
  target.src = people[selectedPerson].file;
  target.alt = people[selectedPerson].name;

  if (success) {
    jesperPassiveUnlocked = true;
    showBubble("Jesper passive unlocked! Trimmer throws!", true);
  } else {
    showBubble("Jesper escaped!", true);
  }

  updateJesperHelper();
  updateHp();
  updateLevelText();
  scheduleSave();
}

function createHitEffect(x, y, critical, amount, label) {
  const effect = document.createElement("div");

  effect.className = "hit-effect";
  effect.innerHTML = critical ? "💥" : "💢";
  effect.style.left = x + "px";
  effect.style.top = y + "px";

  document.body.appendChild(effect);

  setTimeout(function() {
    effect.remove();
  }, 500);

  if (critical || label) {
    const crit = document.createElement("div");

    crit.className = "critical-effect";
    crit.textContent = label || "CRITICAL +" + amount;
    crit.style.left = x + "px";
    crit.style.top = (y - 35) + "px";

    document.body.appendChild(crit);

    setTimeout(function() {
      crit.remove();
    }, 700);
  }
}

function animateTarget(swingHammer) {
  target.classList.remove("bonk");

  if (swingHammer !== false) {
    hammer.classList.remove("swing");
  }

  void target.offsetWidth;

  if (swingHammer !== false) {
    void hammer.offsetWidth;
  }

  target.classList.add("bonk");

  if (swingHammer !== false) {
    hammer.classList.add("swing");
  }
}

window.addEventListener("mousemove", function(e) {
  hammer.style.left = e.clientX + "px";
  hammer.style.top = e.clientY + "px";
});

shopToggle.addEventListener("click", function() {
  shopOpen = !shopOpen;
  updateShopVisibility();
  scheduleSave();
});

shopClose.addEventListener("click", function() {
  shopOpen = false;
  updateShopVisibility();
  scheduleSave();
});

target.addEventListener("click", function(e) {
  clickTimes.push(Date.now());
  registerComboClick();
  addStones(1);

  if (jesperEventActive) {
    jesperEventClicks++;
    addHits(1);
    updateJesperEvent();

    if (jesperEventClicks >= 100) {
      finishJesperEvent(true);
    }

    createHitEffect(e.clientX, e.clientY, false, 1);
  } else {
    const critical = Math.random() < 0.02;
    const baseDamage = critical ? 10 : 1;
    const damage = getAttackDamage(baseDamage);

    addHits(damage);
    damagePerson(damage);
    maybeShowBubble();
    maybeStartJesperEvent();
    createHitEffect(e.clientX, e.clientY, critical, damage);
  }

  animateTarget();
});

setInterval(updateCps, 100);
setInterval(throwTrimmerFromJesper, 1000);

window.addEventListener("beforeunload", saveGameNow);

loadGame();

score.textContent = hits;
target.src = people[selectedPerson].file;
target.alt = people[selectedPerson].name;

updateMoneyText();
updateLevelText();
updateHp();
updateCombo();
renderPersonButtons();
renderShop();
renderHelperRack();
updateShopVisibility();
updateJesperHelper();
</script>

</body>
</html>
