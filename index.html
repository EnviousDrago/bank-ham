<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Ham</title>

<style>
  body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    cursor: none;
    min-height: 100vh;
  }

  h1 {
    padding: 20px;
    font-size: 2.5rem;
  }

  .container {
    margin-top: 50px;
    display: inline-block;
  }

  #target {
    width: 300px;
    border-radius: 10px;
    display: block;
  }

  #target.bonk {
    animation: bonk 0.18s ease;
  }

  @keyframes bonk {
    0% { transform: scale(1); }
    50% { transform: scale(0.94); }
    100% { transform: scale(1); }
  }

  .hammer-cursor {
    position: fixed;
    left: 0;
    top: 0;
    width: 64px;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-20px, -20px);
    transform-origin: 70% 70%;
  }

  .hammer-cursor.swing {
    animation: hammerSwing 0.18s ease;
  }

  @keyframes hammerSwing {
    0% { transform: translate(-20px, -20px) rotate(0deg); }
    50% { transform: translate(-20px, -20px) rotate(-35deg); }
    100% { transform: translate(-20px, -20px) rotate(0deg); }
  }

  .hit-effect {
    position: fixed;
    left: 0;
    top: 0;
    font-size: 65px;
    pointer-events: none;
    z-index: 9999;
    animation: hit 0.5s ease-out forwards;
  }

  @keyframes hit {
    0% {
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 1;
    }

    100% {
      transform: translate(-50%, -50%) scale(1.8);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<h1>Bank Ham</h1>

<div class="container">
  <img id="target" src="steen.png" alt="Steen">
</div>

<img class="hammer-cursor" src="hammer.png" alt="">

<script>
const target = document.getElementById("target");
const hammer = document.querySelector(".hammer-cursor");

window.addEventListener("mousemove", function(e) {
  hammer.style.left = e.clientX + "px";
  hammer.style.top = e.clientY + "px";
});

target.addEventListener("click", function(e) {
  const effect = document.createElement("div");
  effect.className = "hit-effect";
  effect.innerHTML = "💥";
  effect.style.left = e.clientX + "px";
  effect.style.top = e.clientY + "px";
  document.body.appendChild(effect);

  target.classList.remove("bonk");
  hammer.classList.remove("swing");

  void target.offsetWidth;
  void hammer.offsetWidth;

  target.classList.add("bonk");
  hammer.classList.add("swing");

  setTimeout(() => {
    effect.remove();
  }, 500);
});
</script>

</body>
</html>
