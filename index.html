<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Ham</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
      radial-gradient(circle at top left, #3b1d1d, transparent 35%),
      radial-gradient(circle at bottom right, #1f3b35, transparent 35%),
      #0f0f0f;
    background-size: 45px 45px, 45px 45px, 100% 100%, 100% 100%, 100% 100%;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    cursor: none;
    overflow: hidden;
  }

  h1 {
    margin: 0;
    padding: 28px;
    font-size: 4.5rem;
    color: #ffdf5d;
    text-shadow: 0 0 10px #ff3b3b, 0 0 25px #ff9900;
  }

  .game-area {
    height: calc(100vh - 120px);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #target {
    width: 360px;
    max-width: 70vw;
    border-radius: 14px;
    display: block;
    box-shadow: 0 0 30px rgba(255, 223, 93, 0.25);
  }

  #target.bonk {
    animation: bonk 0.16s ease;
  }

  @keyframes bonk {
    0% { transform: scale(1) rotate(0deg); }
    40% { transform: scale(0.93) rotate(-3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .scoreboard {
    position: fixed;
    right: 25px;
    top: 125px;
    width: 230px;
    padding: 22px;
    border: 3px solid #ffdf5d;
    background: rgba(0, 0, 0, 0.72);
    border-radius: 14px;
    box-shadow: 0 0 35px rgba(255, 223, 93, 0.28);
    z-index: 50;
  }

  .score-label {
    font-size: 1.5rem;
    color: #ffdf5d;
  }

  #score {
    font-size: 4.2rem;
    font-weight: bold;
    line-height: 1;
    margin-bottom: 18px;
  }

  .cps-label {
    font-size: 1.4rem;
    color: #ffdf5d;
    border-top: 2px solid rgba(255, 223, 93, 0.45);
    padding-top: 16px;
  }

  #cps {
    font-size: 3rem;
    font-weight: bold;
  }

  .speech-bubble {
    position: fixed;
    max-width: 310px;
    padding: 15px 19px;
    background: white;
    color: #111;
    border: 3px solid #ffdf5d;
    border-radius: 16px;
    font-size: 1.35rem;
    font-weight: bold;
    z-index: 9997;
    pointer-events: none;
    animation: bubblePop 1.8s ease-out forwards;
    box-shadow: 0 0 22px rgba(255, 223, 93, 0.4);
  }

  .speech-bubble::after {
    content: "";
    position: absolute;
    left: 35px;
    bottom: -15px;
    border-width: 15px 12px 0 12px;
    border-style: solid;
    border-color: white transparent transparent transparent;
  }

  @keyframes bubblePop {
    0% { transform: scale(0.5) translateY(10px); opacity: 0; }
    15% { transform: scale(1) translateY(0); opacity: 1; }
    75% { transform: scale(1) translateY(0); opacity: 1; }
    100% { transform: scale(0.9) translateY(-18px); opacity: 0; }
  }

  .hammer-cursor {
    position: fixed;
    left: 0;
    top: 0;
    width: 64px;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-22px, -20px);
    transform-origin: 70% 70%;
  }

  .hammer-cursor.swing {
    animation: hammerSwing 0.18s ease;
  }

  @keyframes hammerSwing {
    0% { transform: translate(-22px, -20px) rotate(0deg); }
    50% { transform: translate(-22px, -20px) rotate(-40deg); }
    100% { transform: translate(-22px, -20px) rotate(0deg); }
  }

  .hit-effect {
    position: fixed;
    left: 0;
    top: 0;
    font-size: 75px;
    pointer-events: none;
    z-index: 9999;
    animation: hit 0.5s ease-out forwards;
  }

  @keyframes hit {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
  }
</style>
</head>

<body>

<h1>Bank Ham</h1>

<div class="scoreboard">
  <div class="score-label">Hits</div>
  <div id="score">0</div>

  <div class="cps-label">CPS</div>
  <div id="cps">0.0</div>
</div>

<div class="game-area">
  <img id="target" src="steen.png" alt="Steen">
</div>

<img class="hammer-cursor" src="hammer.png" alt="">

<script>
const target = document.getElementById("target");
const hammer = document.querySelector(".hammer-cursor");
const score = document.getElementById("score");
const cps = document.getElementById("cps");

let hits = 0;
let clickTimes = [];

const bubbleTexts = [
  "hvad fanden var det!!!!",
  "jeg fik den LIGE på hovedt!!!!"
];

window.addEventListener("mousemove", function(e) {
  hammer.style.left = e.clientX + "px";
  hammer.style.top = e.clientY + "px";
});

function updateCps() {
  const now = Date.now();
  clickTimes = clickTimes.filter(time => now - time < 1000);
  cps.textContent = clickTimes.length.toFixed(1);
}

function showBubble() {
  const rect = target.getBoundingClientRect();
  const bubble = document.createElement("div");

  bubble.className = "speech-bubble";
  bubble.textContent = bubbleTexts[Math.floor(Math.random() * bubbleTexts.length)];

  bubble.style.left = (rect.left + rect.width * 0.55) + "px";
  bubble.style.top = (rect.top - 95) + "px";

  document.body.appendChild(bubble);

  setTimeout(() => {
    bubble.remove();
  }, 1800);
}

setInterval(updateCps, 100);

target.addEventListener("click", function(e) {
  hits++;
  score.textContent = hits;

  clickTimes.push(Date.now());
  updateCps();

  if (hits === 1 || Math.random() < 0.35) {
    showBubble();
  }

  const effect = document.createElement("div");
  effect.className = "hit-effect";
  effect.innerHTML = "💥";
  effect.style.left = e.clientX + "px";
  effect.style.top = e.clientY + "px";
  document.body.appendChild(effect);

  target.classList.remove("bonk");
  hammer.classList.remove("swing");

  void target.offsetWidth;
  void hammer.offsetWidth;

  target.classList.add("bonk");
  hammer.classList.add("swing");

  setTimeout(() => {
    effect.remove();
  }, 500);
});
</script>

</body>
</html>
