<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Ham</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
      radial-gradient(circle at top left, #3b1d1d, transparent 35%),
      radial-gradient(circle at bottom right, #1f3b35, transparent 35%),
      #0f0f0f;
    background-size: 45px 45px, 45px 45px, 100% 100%, 100% 100%, 100% 100%;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    cursor: none;
    overflow: hidden;
  }

  h1 {
    margin: 0;
    padding: 28px;
    font-size: 4.5rem;
    color: #ffdf5d;
    text-shadow: 0 0 10px #ff3b3b, 0 0 25px #ff9900;
  }

  .game-area {
    height: calc(100vh - 120px);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #target {
    width: 360px;
    max-width: 70vw;
    border-radius: 14px;
    display: block;
    box-shadow: 0 0 30px rgba(255, 223, 93, 0.25);
  }

  #target.bonk {
    animation: bonk 0.16s ease;
  }

  @keyframes bonk {
    0% { transform: scale(1) rotate(0deg); }
    40% { transform: scale(0.93) rotate(-3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .scoreboard, .selector {
    position: fixed;
    width: 250px;
    padding: 20px;
    border: 3px solid #ffdf5d;
    background: rgba(0, 0, 0, 0.72);
    border-radius: 14px;
    box-shadow: 0 0 35px rgba(255, 223, 93, 0.28);
    z-index: 50;
  }

  .scoreboard {
    right: 25px;
    top: 120px;
  }

  .selector {
    left: 25px;
    top: 120px;
  }

  .score-label, .cps-label, .level-label, .selector-title {
    font-size: 1.35rem;
    color: #ffdf5d;
  }

  #score {
    font-size: 4rem;
    font-weight: bold;
    line-height: 1;
    margin-bottom: 18px;
  }

  #cps, #level {
    font-size: 2.5rem;
    font-weight: bold;
  }

  .panel-section {
    border-top: 2px solid rgba(255, 223, 93, 0.45);
    padding-top: 14px;
    margin-top: 14px;
  }

  #nextUnlock {
    margin-top: 8px;
    font-size: 0.95rem;
    opacity: 0.85;
  }

  .person-button {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: 2px solid #ffdf5d;
    background: #151515;
    color: white;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 10px;
    cursor: none;
  }

  .person-button.active {
    background: #ffdf5d;
    color: #111;
  }

  .person-button.locked {
    opacity: 0.45;
    border-color: #777;
  }

  .speech-bubble {
    position: fixed;
    max-width: 330px;
    padding: 15px 19px;
    background: white;
    color: #111;
    border: 3px solid #ffdf5d;
    border-radius: 16px;
    font-size: 1.35rem;
    font-weight: bold;
    z-index: 9997;
    pointer-events: none;
    animation: bubblePop 1.8s ease-out forwards;
    box-shadow: 0 0 22px rgba(255, 223, 93, 0.4);
  }

  .speech-bubble.rare {
    background: #ff3b3b;
    color: white;
    border-color: white;
  }

  .speech-bubble::after {
    content: "";
    position: absolute;
    left: 35px;
    bottom: -15px;
    border-width: 15px 12px 0 12px;
    border-style: solid;
    border-color: white transparent transparent transparent;
  }

  .speech-bubble.rare::after {
    border-color: #ff3b3b transparent transparent transparent;
  }

  @keyframes bubblePop {
    0% { transform: scale(0.5) translateY(10px); opacity: 0; }
    15% { transform: scale(1) translateY(0); opacity: 1; }
    75% { transform: scale(1) translateY(0); opacity: 1; }
    100% { transform: scale(0.9) translateY(-18px); opacity: 0; }
  }

  .hammer-cursor {
    position: fixed;
    left: 0;
    top: 0;
    width: 64px;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-22px, -20px);
    transform-origin: 70% 70%;
  }

  .hammer-cursor.swing {
    animation: hammerSwing 0.18s ease;
  }

  @keyframes hammerSwing {
    0% { transform: translate(-22px, -20px) rotate(0deg); }
    50% { transform: translate(-22px, -20px) rotate(-40deg); }
    100% { transform: translate(-22px, -20px) rotate(0deg); }
  }

  .hit-effect {
    position: fixed;
    left: 0;
    top: 0;
    font-size: 75px;
    pointer-events: none;
    z-index: 9999;
    animation: hit 0.5s ease-out forwards;
  }

  @keyframes hit {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
  }
</style>
</head>

<body>

<h1>Bank Ham</h1>

<div class="selector">
  <div class="selector-title">Choose Person</div>
  <div id="personButtons"></div>
</div>

<div class="scoreboard">
  <div class="score-label">Hits</div>
  <div id="score">0</div>

  <div class="panel-section">
    <div class="cps-label">CPS</div>
    <div id="cps">0.0</div>
  </div>

  <div class="panel-section">
    <div class="level-label">Level</div>
    <div id="level">1</div>
    <div id="nextUnlock">Next: 500 hits</div>
  </div>
</div>

<div class="game-area">
  <img id="target" src="steen.png" alt="Steen">
</div>

<img class="hammer-cursor" src="hammer.png" alt="">

<script>
const target = document.getElementById("target");
const hammer = document.querySelector(".hammer-cursor");
const score = document.getElementById("score");
const cps = document.getElementById("cps");
const level = document.getElementById("level");
const nextUnlock = document.getElementById("nextUnlock");
const personButtons = document.getElementById("personButtons");

const people = [
  {
    name: "Steen",
    file: "steen.png",
    unlockAt: 0,
    bubbles: [
      "hvad fanden var det!!!!",
      "jeg fik den LIGE på hovedt!!!!"
    ],
    rareBubbles: [
      "walla jeg rammer tilbage din lille taber!!!!"
    ]
  },
  {
    name: "Britta",
    file: "britta500.jpg",
    unlockAt: 500,
    bubbles: [
      "jeg skriver hjem!!!!!!",
      "ud fra klassen nu."
    ],
    rareBubbles: [
      "jeg chopper dig ned walla"
    ]
  },
  {
    name: "Mette",
    file: "mette1000.jpg",
    unlockAt: 1000,
    bubbles: [
      "jeg gider ikk at diskuter",
      "BOWLLINGGGGGGG"
    ],
    rareBubbles: []
  }
];

let hits = 0;
let clickTimes = [];
let currentPerson = 0;

window.addEventListener("mousemove", function(e) {
  hammer.style.left = e.clientX + "px";
  hammer.style.top = e.clientY + "px";
});

function getLevel() {
  if (hits >= 1000) return 3;
  if (hits >= 500) return 2;
  return 1;
}

function isUnlocked(personIndex) {
  return hits >= people[personIndex].unlockAt;
}

function updateCps() {
  const now = Date.now();
  clickTimes = clickTimes.filter(time => now - time < 1000);
  cps.textContent = clickTimes.length.toFixed(1);
}

function updateLevelText() {
  level.textContent = getLevel();

  if (hits < 500) {
    nextUnlock.textContent = "Next: Britta at 500 hits";
  } else if (hits < 1000) {
    nextUnlock.textContent = "Next: Mette at 1000 hits";
  } else {
    nextUnlock.textContent = "All people unlocked";
  }
}

function renderPersonButtons() {
  personButtons.innerHTML = "";

  people.forEach(function(person, index) {
    const button = document.createElement("button");
    button.className = "person-button";
    button.textContent = isUnlocked(index)
      ? person.name
      : person.name + " - locked";

    if (index === currentPerson) {
      button.classList.add("active");
    }

    if (!isUnlocked(index)) {
      button.classList.add("locked");
    }

    button.addEventListener("click", function() {
      if (!isUnlocked(index)) {
        showBubble("Unlock at " + person.unlockAt + " hits!", false);
        return;
      }

      currentPerson = index;
      target.src = person.file;
      renderPersonButtons();
      showBubble(person.name + " selected!", false);
    });

    personButtons.appendChild(button);
  });
}

function showBubble(text, rare) {
  const rect = target.getBoundingClientRect();
  const bubble = document.createElement("div");

  bubble.className = rare ? "speech-bubble rare" : "speech-bubble";
  bubble.textContent = text;

  bubble.style.left = Math.min(window.innerWidth - 350, rect.left + rect.width * 0.55) + "px";
  bubble.style.top = Math.max(85, rect.top - 95) + "px";

  document.body.appendChild(bubble);

  setTimeout(() => {
    bubble.remove();
  }, 1800);
}

function maybeShowBubble() {
  const person = people[currentPerson];
  const roll = Math.random();

  if (person.rareBubbles.length > 0 && roll < 0.015) {
    showBubble(person.rareBubbles[Math.floor(Math.random() * person.rareBubbles.length)], true);
  } else if (roll < 0.10) {
    showBubble(person.bubbles[Math.floor(Math.random() * person.bubbles.length)], false);
  }
}

setInterval(updateCps, 100);
updateLevelText();
renderPersonButtons();

target.addEventListener("click", function(e) {
  hits++;
  score.textContent = hits;

  clickTimes.push(Date.now());
  updateCps();
  updateLevelText();
  renderPersonButtons();
  maybeShowBubble();

  const effect = document.createElement("div");
  effect.className = "hit-effect";
  effect.innerHTML = "💥";
  effect.style.left = e.clientX + "px";
  effect.style.top = e.clientY + "px";
  document.body.appendChild(effect);

  target.classList.remove("bonk");
  hammer.classList.remove("swing");

  void target.offsetWidth;
  void hammer.offsetWidth;

  target.classList.add("bonk");
  hammer.classList.add("swing");

  setTimeout(() => {
    effect.remove();
  }, 500);
});
</script>

</body>
</html>
