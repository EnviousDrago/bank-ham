<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Ham</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
      linear-gradient(135deg, #0f0f0f, #1c1414, #111827);
    background-size: 40px 40px, 40px 40px, 100% 100%;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    cursor: none;
    overflow: hidden;
  }

  h1 {
    padding: 25px;
    font-size: 4rem;
    margin: 0;
    color: #ffdd55;
    text-shadow: 0 0 15px #ff3b3b, 0 0 30px #ff9900;
  }

  .container {
    margin-top: 45px;
    display: inline-block;
  }

  #target {
    width: 340px;
    border-radius: 14px;
    display: block;
    box-shadow: 0 0 35px rgba(255, 221, 85, 0.25);
  }

  #target.bonk {
    animation: bonk 0.18s ease;
  }

  @keyframes bonk {
    0% { transform: scale(1); }
    50% { transform: scale(0.92) rotate(-2deg); }
    100% { transform: scale(1); }
  }

  .scoreboard {
    position: fixed;
    right: 35px;
    top: 130px;
    padding: 20px 25px;
    border: 2px solid #ffdd55;
    background: rgba(0, 0, 0, 0.55);
    box-shadow: 0 0 25px rgba(255, 221, 85, 0.25);
    border-radius: 12px;
    text-align: center;
  }

  .score-title {
    font-size: 1.4rem;
    color: #ffdd55;
    margin-bottom: 8px;
  }

  .score-number {
    font-size: 4rem;
    font-weight: bold;
  }

  .hammer-cursor {
    position: fixed;
    left: 0;
    top: 0;
    width: 64px;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-20px, -20px);
    transform-origin: 70% 70%;
  }

  .hammer-cursor.swing {
    animation: hammerSwing 0.18s ease;
  }

  @keyframes hammerSwing {
    0% { transform: translate(-20px, -20px) rotate(0deg); }
    50% { transform: translate(-20px, -20px) rotate(-38deg); }
    100% { transform: translate(-20px, -20px) rotate(0deg); }
  }

  .hit-effect {
    position: fixed;
    left: 0;
    top: 0;
    font-size: 75px;
    pointer-events: none;
    z-index: 9999;
    animation: hit 0.5s ease-out forwards;
  }

  @keyframes hit {
    0% {
      transform: translate(-50%, -50%) scale(0.5);
      opacity: 1;
    }

    100% {
      transform: translate(-50%, -50%) scale(2);
      opacity: 0;
    }
  }

  .spark {
    position: fixed;
    font-size: 28px;
    pointer-events: none;
    z-index: 9998;
    animation: sparkFly 0.55s ease-out forwards;
  }

  @keyframes sparkFly {
    0% {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    100% {
      transform: translate(var(--x), var(--y)) scale(0);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<h1>Bank Ham</h1>

<div class="scoreboard">
  <div class="score-title">Hits</div>
  <div id="score" class="score-number">0</div>
</div>

<div class="container">
  <img id="target" src="steen.png" alt="Steen">
</div>

<img class="hammer-cursor" src="hammer.png" alt="">

<script>
const target = document.getElementById("target");
const hammer = document.querySelector(".hammer-cursor");
const score = document.getElementById("score");

let hits = 0;

window.addEventListener("mousemove", function(e) {
  hammer.style.left = e.clientX + "px";
  hammer.style.top = e.clientY + "px";
});

target.addEventListener("click", function(e) {
  hits++;
  score.textContent = hits;

  const effect = document.createElement("div");
  effect.className = "hit-effect";
  effect.innerHTML = "💥";
  effect.style.left = e.clientX + "px";
  effect.style.top = e.clientY + "px";
  document.body.appendChild(effect);

  for (let i = 0; i < 6; i++) {
    const spark = document.createElement("div");
    spark.className = "spark";
    spark.innerHTML = "✦";
    spark.style.left = e.clientX + "px";
    spark.style.top = e.clientY + "px";
    spark.style.setProperty("--x", (Math.random() * 140 - 70) + "px");
    spark.style.setProperty("--y", (Math.random() * 140 - 70) + "px");
    document.body.appendChild(spark);

    setTimeout(() => {
      spark.remove();
    }, 550);
  }

  target.classList.remove("bonk");
  hammer.classList.remove("swing");

  void target.offsetWidth;
  void hammer.offsetWidth;

  target.classList.add("bonk");
  hammer.classList.add("swing");

  setTimeout(() => {
    effect.remove();
  }, 500);
});
</script>

</body>
</html>
