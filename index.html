<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Ham</title>

<style>
  body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    text-align: center;
    font-family: Arial;
    cursor: url('hammer.png'), auto;
  }

  h1 {
    padding: 20px;
    font-size: 2.5rem;
  }

  .container {
    margin-top: 50px;
    position: relative;
  }

  img {
    width: 300px;
    border-radius: 10px;
    transition: transform 0.1s;
  }

  .hit-effect {
    position: absolute;
    width: 80px;
    height: 80px;
    pointer-events: none;
    animation: hit 0.3s ease-out forwards;
  }

  @keyframes hit {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
</style>
</head>

<body>

<h1>Bank Ham</h1>

<div class="container">
  <img id="target" src="steen.png" alt="AI Person">
</div>

<script>
const target = document.getElementById("target");

target.addEventListener("click", function(e) {
  // small "hit" animation on image
  target.style.transform = "scale(0.95)";
  setTimeout(() => {
    target.style.transform = "scale(1)";
  }, 100);

  // create hit effect
  const effect = document.createElement("div");
  effect.className = "hit-effect";
  effect.style.left = (e.offsetX - 40) + "px";
  effect.style.top = (e.offsetY - 40) + "px";

  // optional: emoji effect
  effect.innerHTML = "💥";

  document.querySelector(".container").appendChild(effect);

  setTimeout(() => {
    effect.remove();
  }, 300);
});
</script>

</body>
</html>
