<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Ham</title>

<style>
  html,
  body,
  #target {
    cursor: url("./hammer.png") 64 64, pointer;
  }

  body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  h1 {
    padding: 20px;
    font-size: 2.5rem;
  }

  .container {
    margin-top: 50px;
    display: inline-block;
  }

  #target {
    width: 300px;
    border-radius: 10px;
    display: block;
  }

  #target.bonk {
    animation: bonk 0.18s ease;
  }

  @keyframes bonk {
    0% { transform: scale(1); }
    50% { transform: scale(0.94); }
    100% { transform: scale(1); }
  }

  .hit-effect {
    position: fixed;
    left: 0;
    top: 0;
    font-size: 70px;
    pointer-events: none;
    z-index: 9999;
    animation: hit 0.6s ease-out forwards;
  }

  @keyframes hit {
    0% {
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 1;
    }

    50% {
      transform: translate(-50%, -50%) scale(1.4) rotate(-12deg);
      opacity: 1;
    }

    100% {
      transform: translate(-50%, -50%) scale(2) rotate(15deg);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<h1>Bank Ham</h1>

<div class="container">
  <img id="target" src="steen.png" alt="Steen">
</div>

<script>
const target = document.getElementById("target");

target.addEventListener("click", function(e) {
  const effect = document.createElement("div");
  effect.className = "hit-effect";
  effect.innerHTML = "💥";

  effect.style.left = e.clientX + "px";
  effect.style.top = e.clientY + "px";

  document.body.appendChild(effect);

  target.classList.remove("bonk");
  void target.offsetWidth;
  target.classList.add("bonk");

  setTimeout(() => {
    effect.remove();
  }, 600);
});
</script>

</body>
</html>
