<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Ham</title>

<style>
  html,
  body,
  .container,
  #target {
    cursor: url("./hammer.png") 64 64, pointer;
  }

  body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
  }

  h1 {
    padding: 20px;
    font-size: 2.5rem;
  }

  .container {
    margin-top: 50px;
    position: relative;
    display: inline-block;
  }

  #target {
    width: 300px;
    border-radius: 10px;
    transition: transform 0.1s;
    display: block;
  }

  .hit-effect {
    position: absolute;
    font-size: 55px;
    pointer-events: none;
    z-index: 10;
    animation: hit 0.35s ease-out forwards;
  }

  @keyframes hit {
    0% {
      transform: translate(-50%, -50%) scale(0.4);
      opacity: 1;
    }

    100% {
      transform: translate(-50%, -50%) scale(1.8);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<h1>Bank Ham</h1>

<div class="container">
  <img id="target" src="steen.png" alt="Steen">
</div>

<script>
const target = document.getElementById("target");
const container = document.querySelector(".container");

target.addEventListener("click", function(e) {
  target.style.transform = "scale(0.95)";

  setTimeout(() => {
    target.style.transform = "scale(1)";
  }, 100);

  const effect = document.createElement("div");
  effect.className = "hit-effect";
  effect.innerHTML = "💥";

  const rect = target.getBoundingClientRect();

  effect.style.left = (e.clientX - rect.left) + "px";
  effect.style.top = (e.clientY - rect.top) + "px";

  container.appendChild(effect);

  setTimeout(() => {
    effect.remove();
  }, 350);
});
</script>

</body>
</html>
